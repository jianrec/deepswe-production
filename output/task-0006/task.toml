display_description = "Zustand ships several first-party middlewares (persist, devtools, redux, immer, subscribeWithSelector, combine) but has no built-in way to record a store's update history for undo/redo and time-travel. Applications that need editors, form wizards, or drawing canvases currently reach for third-party packages or hand-roll snapshot stacks that break when combined with immer or persist. Add a first-party `history` middleware that transparently records past and future states of a store and exposes an"
