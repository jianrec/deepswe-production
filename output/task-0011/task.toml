display_description = "Zustand ships middleware for persistence, immer, devtools and subscribeWithSelector, but has no first-party way to express derived (computed) state. Users repeatedly re-derive values inside selectors, which recomputes on every render and loses referential stability, or they hand-roll subscriptions that duplicate base state. We want a supported, composable solution that lives at both the store layer and the React layer. Deliver two coordinated pieces sharing one memoization core: 1) A vanilla `co"
