display_title = "Spend budget guardrails: per-scope USD budgets with threshold events, redaction-safe telemetry, and CLI/footer surfacing"
display_description = "Hermes tracks token usage and translates it to money through `agent/usage_pricing.py` and `agent/credits_tracker.py`, and it renders spend in `agent/billing_view.py`, `agent/display.py`, and the gateway footer. Today there is no way for an operator to cap how much a session (or a calendar day) is allowed to spend, and no structured signal when spend crosses a threshold. Users running the agent unattended on a VPS or from a chat platform want a budget they can set once and have the agent honor. A"
original_title = "Spend budget guardrails: per-scope USD budgets with threshold events, redaction-safe telemetry, and CLI/footer surfacing"
