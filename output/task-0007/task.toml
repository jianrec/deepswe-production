[metadata]
task_id = "add-http-range-request-rfc-7233-support-with-0007"
display_title = "Add HTTP Range request (RFC 7233) support with partial content, multipart/byteranges, and If-Range conditional handling"
display_description = "Gin can stream an arbitrary payload to a client with `Context.DataFromReader`, but it always sends the whole body with a 200 status and ignores the client's `Range` request header. Only `Context.File` benefits from range handling today, because it delegates to the standard library's `http.ServeContent`. Applications that stream generated artifacts, blobs pulled from object storage, media, or embedded-FS assets through `DataFromReader`/`FileFromFS` therefore cannot support resumable downloads, me"
original_title = "Add HTTP Range request (RFC 7233) support with partial content, multipart/byteranges, and If-Range conditional handling"
category = "feature_request"
language = "go"
repository = "gin-gonic/gin"
repository_url = "https://github.com/gin-gonic/gin.git"
base_commit_hash = "34dac209ffb6ef85cc78c5d217bbb7ad001d68fd"

