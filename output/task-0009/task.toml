display_description = "The cryptography examples currently implement each alphabet and modular rule locally. Caesar builds its own character map, Hill hard-codes uppercase English conversion and only supports encryption, and callers have no reusable way to validate alphabets or calculate modular inverses. This makes otherwise simple cipher round trips inconsistent and leaves the advertised Hill decrypt function as a stub. Add a reusable classical-cipher foundation. Introduce an alphabet codec that validates a non-empt"
