task_id = "add-functional-traversal-utilities-reduce-fi-0004"
display_title = "Add functional traversal utilities (reduce, filter, find, toKeyedArray) to React.Children with a shared key-path module"
display_description = "React.Children today exposes only `map`, `forEach`, `count`, `toArray`, and `only`. Application and library authors who need to fold over, select, or inspect an opaque `children` value are forced to first materialize `React.Children.toArray(children)` and then use Array methods. That is wasteful (an intermediate array is always allocated), and — more importantly — it loses the stable, collision-free traversal keys React computes internally, so downstream code that re-keys or reconciles selected "
original_title = "Add functional traversal utilities (reduce, filter, find, toKeyedArray) to React.Children with a shared key-path module"
category = "feature_request"
