task_id = "key-based-ordering-toolkit-opt-in-key-revers-0008"
display_title = "Key-based ordering toolkit: opt-in `key`/`reverse` across core searches, sorts, and natural string keys"
display_description = "The `searches`, `sorts`, and `strings` packages each compare elements ad-hoc: every algorithm hard-codes `<`/`>` on raw elements, so none of them can sort or search *by a derived key* the way Python's built-in `sorted`, `min`, and `bisect` allow via `key=`. There is also no shared, correct way to order strings the way humans expect (\"img2\" before \"img10\"), even though `sorts/natural_sort.py` hints at the need. Build a small, opt-in ordering toolkit and wire it into a curated set of algorithms. 1"
original_title = "Key-based ordering toolkit: opt-in `key`/`reverse` across core searches, sorts, and natural string keys"
