[metadata]
task_id = "add-a-deterministic-dry-run-launch-plan-to-o-0002"
display_title = "Add a deterministic dry-run Launch Plan to `ollama launch`"
display_description = "`ollama launch <integration>` configures a third-party coding tool (Claude Code, Codex, Copilot CLI, OpenCode, and the other registered integrations) to talk to the local Ollama server and then executes it. Today this happens as a single opaque side-effecting step: the command resolves a model, sets environment variables, may create or patch on-disk config files for the target tool, and then execs the tool's binary. Users and scripts have no way to preview exactly what `launch` will change befor"
original_title = "Add a deterministic dry-run Launch Plan to `ollama launch`"
category = "feature_request"
language = "go"
repository = "ollama/ollama"
repository_url = "https://github.com/ollama/ollama.git"
base_commit_hash = "144893850fa778c8c81ff931f26614d62e6689c1"

[verifier]
